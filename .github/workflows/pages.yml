name: Publish portfolio manually
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      BASE_PATH: ${{ vars.BASE_PATH }}
    steps:
      - uses: actions/checkout@v5
      - name: Check public URL
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "Configure SITE_URL before publishing."
            exit 1
          fi
      - uses: withastro/action@v5
        with:
          node-version: 24
          package-manager: npm
          build-cmd: npm run build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
